var LANG = "en";
function t(k){ var v = (T[LANG] || T.en)[k]; return v === undefined ? k : v; }

var B = location.origin + "/api/data/v9.2/";
var H = { "Accept":"application/json", "OData-MaxVersion":"4.0", "OData-Version":"4.0" };
var LS = "exporttopdf";
var CACHE_DEFAULTS = { caches:true, idb:false, sw:false };

var ENV = { name:null, production:false };
var S = { record:null, count:0, raw:"", json:{}, etag:null, saving:false, jsonBroken:false, tables:[], changes:{},
          filter:"all", templatesOnly:true, readErrors:[], lastChange:null,
          ich:null, writePrivilege:null, mayWrite:null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function store(k,v){ try{ localStorage.setItem(LS+"."+k, v); }catch(e){} }
function readStored(k){ try{ return localStorage.getItem(LS+"."+k); }catch(e){ return null; } }

var ALERT = { ok:"success", warn:"warning", err:"error", info:"information" };
var ALERT_ICON = { ok:"\u2713", warn:"!", err:"!", info:"i" };
function message(art, html){
  var m = $("message");
  m.className = "an x-alert x-alert-" + (ALERT[art] || "neutral");
  m.innerHTML = '<span class="x-alert-icon" aria-hidden="true">' + ALERT_ICON[art] + '</span>'
    + '<div><p class="x-alert-body">' + html + "</p></div>";
}
function hideMessage(){ var m = $("message"); m.className = ""; m.innerHTML = ""; }

async function web(pfad){
  var r = await fetch(B + pfad, { method:"GET", credentials:"same-origin", headers:H });
  if(!r.ok){ var e = new Error("GET " + pfad.split("?")[0] + " HTTP " + r.status + ": " + (await r.text()).slice(0,300)); e.status = r.status; throw e; }
  return r.json();
}
async function send(m, pfad, body, etag){
  var hd = { "Accept":"application/json", "Content-Type":"application/json; charset=utf-8",
             "OData-MaxVersion":"4.0", "OData-Version":"4.0" };
  if(m === "PATCH"){
    if(!etag){ throw new Error(t("errEtagKurz")); }
    hd["If-Match"] = etag;
  }
  var r = await fetch(B + pfad, { method:m, credentials:"same-origin", headers:hd, body:JSON.stringify(body) });
  if(!r.ok){ var e = new Error(m + " HTTP " + r.status + ": " + (await r.text()).slice(0,400)); e.status = r.status; throw e; }
  return true;
}
async function allPages(pfad){
  var out = [], url = pfad;
  while(url){
    var j = await web(url);
    out = out.concat(j.value || []);
    var n = j["@odata.nextLink"];
    url = n ? n.slice(n.indexOf("/api/data/v9.2/") + 15) : null;
  }
  return out;
}

async function readEnvironment(){
  try{
    var o = await web("RetrieveCurrentOrganization(AccessType=@p1)?@p1=Microsoft.Dynamics.CRM.EndpointAccessType'Default'");
    var d = o.Detail || {};
    ENV.name = d.FriendlyName || d.UniqueName || null;
  }catch(e){ ENV.name = null; }
  if(!ENV.name){ ENV.name = location.host.split(".")[0]; }
  ENV.production = /\b(prod|prd|live)\b/i.test(ENV.name);
}

async function load(){
  var P = await web("pdfsettings?$select=pdfsettingid,pdfsettingsjson");
  var records = P.value || [];
  S.count = records.length;
  S.record = records[0] || null;
  S.raw = S.record ? (S.record.pdfsettingsjson || "") : "";
  S.etag = S.record ? (S.record["@odata.etag"] || null) : null;
  S.jsonBroken = false;
  S.json = {};
  if(S.raw){
    var P0 = null;
    try{ P0 = JSON.parse(S.raw); }catch(e){ S.jsonBroken = true; }
    if(!S.jsonBroken){
      if(!P0 || typeof P0 !== "object" || Array.isArray(P0)){ S.jsonBroken = true; }
      else if(Object.keys(P0).some(function(k){ return typeof P0[k] !== "boolean"; })){ S.jsonBroken = true; }
      else { S.json = P0; }
    }
  }

  var V = [];
  try{ V = await allPages("documenttemplates?$select=name,associatedentitytypecode,status&$filter=documenttype%20eq%202"); }
  catch(e){ S.readErrors.push(e.message); }
  var templates = {};
  V.forEach(function(x){
    var k = String(x.associatedentitytypecode || "").toLowerCase();
    if(!k){ return; }
    var z = templates[k] = templates[k] || { fertig:0, entwurf:0 };
    if(x.status === true){ z.entwurf++; } else { z.fertig++; }
  });

  var E = await allPages("EntityDefinitions?$select=LogicalName,ObjectTypeCode,IsCustomEntity,IsPrivate,DisplayName");
  var list = [], gesehen = {};
  E.forEach(function(d){
    var k = String(d.LogicalName || "").toLowerCase();
    if(!k || d.IsPrivate === true){ return; }
    gesehen[k] = true;
    list.push({ t:k, label:((d.DisplayName || {}).UserLocalizedLabel || {}).Label || null,
                 otc:d.ObjectTypeCode, custom:d.IsCustomEntity === true,
                 templates:((templates[k] || {}).fertig || 0),
                 entwuerfe:((templates[k] || {}).entwurf || 0), enabled:S.json[k] === true });
  });
  Object.keys(S.json).forEach(function(k){
    var n = String(k).toLowerCase();
    if(!gesehen[n]){
      list.push({ t:n, label:null, otc:null, custom:null,
                   templates:((templates[n] || {}).fertig || 0),
                   entwuerfe:((templates[n] || {}).entwurf || 0), enabled:S.json[k] === true, orphan:true });
    }
  });
  list.sort(function(a,b){
    var x = (a.label || a.t).toLowerCase(), y = (b.label || b.t).toLowerCase();
    return x < y ? -1 : x > y ? 1 : 0;
  });
  S.tables = list;
}

async function checkPrivileges(){
  try{
    S.ich = (await web("WhoAmI()")).UserId;
    var P = (await web("EntityDefinitions(LogicalName='pdfsetting')/Privileges?$select=Name,PrivilegeId,PrivilegeType")).value || [];
    var w = P.filter(function(x){ return x.PrivilegeType === 2 || /write/i.test(x.Name || ""); })[0];
    if(!w){ return; }
    S.writePrivilege = w.PrivilegeId;
    var U = await web("systemusers(" + S.ich + ")/Microsoft.Dynamics.CRM.RetrieveUserPrivileges()");
    var L = U.RolePrivileges || U.rolePrivileges || [];
    if(!L.length){ S.mayWrite = null; return; }
    S.mayWrite = L.some(function(x){
      return String(x.PrivilegeId || x.privilegeId || "").toLowerCase() === String(w.PrivilegeId).toLowerCase();
    });
  }catch(e){
    S.mayWrite = null;
  }
}

async function rolesWithWriteAccess(){
  if(!S.writePrivilege){ throw new Error("kein Privileg ermittelt"); }
  var RP = (await web("roleprivilegescollection?$select=roleid,privilegedepthmask&$filter=privilegeid eq " + S.writePrivilege)).value || [];
  var ids = {}, L = [];
  RP.forEach(function(x){ var r = String(x.roleid || "").toLowerCase(); if(r && !ids[r]){ ids[r] = 1; L.push(r); } });
  var names = {};
  for(var i = 0; i < L.length; i += 20){
    var part = L.slice(i, i + 20).map(function(r){ return "roleid eq " + r; }).join(" or ");
    var R = (await web("roles?$select=name,roleid&$filter=" + encodeURIComponent(part))).value || [];
    R.forEach(function(r){ names[r.name] = 1; });
  }
  return Object.keys(names).sort();
}

async function whoCanChangeFlow(){
  var dlg = $("dlgW");
  $("dlgW-body").innerHTML = "<p>" + esc(t("wdLade")) + "</p>";
  dlg.returnValue = "";
  if(typeof dlg.showModal === "function"){ dlg.showModal(); }
  var h = "<p>" + t("wdDu")(S.mayWrite) + "</p>";
  try{
    var R = await rolesWithWriteAccess();
    if(!R.length){ h += '<div class="note-box">' + esc(t("wdKeine")) + "</div>"; }
    else {
      h += "<p style=\"margin-top:12px\">" + esc(t("wdRollen")(R.length)) + "</p><ul>"
         + R.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
    }
  }catch(e){
    h += '<div class="note-box">' + esc(t("wdFehler")) + "</div>";
  }
  h += '<p class="dlg-note">' + esc(t("wdHinweis")) + "</p>";
  $("dlgW-body").innerHTML = h;
}

function targetState(x){ return (x.t in S.changes) ? S.changes[x.t] : x.enabled; }
function canSave(){ return S.count === 1 && !S.jsonBroken && !!S.etag && S.mayWrite !== false; }
function name(x){ return x.label || x.t; }

function visibleRows(){
  var q = ($("search").value || "").trim().toLowerCase();
  return S.tables.filter(function(x){
    var s = targetState(x);
    if(S.templatesOnly && !x.templates){ return false; }
    if(S.filter === "enabled" && !s){ return false; }
    if(S.filter === "custom" && !x.custom){ return false; }
    if(!q){ return true; }
    return x.t.indexOf(q) >= 0 || (x.label || "").toLowerCase().indexOf(q) >= 0;
  });
}

function render(){
  var L = visibleRows(), h = "";
  L.slice(0, 400).forEach(function(x){
    var s = targetState(x), ge = (x.t in S.changes);
    h += '<tr class="' + (ge ? "changed" : "") + '">'
      + '<td><label class="toggle"><input type="checkbox" data-t="' + esc(x.t) + '"' + (s ? " checked" : "")
      + (S.saving || S.mayWrite === false ? " disabled" : "")
      + ' aria-label="' + esc(t("toggle")(name(x))) + '"><span></span></label></td>'
      + '<td><div class="table-name">' + esc(name(x))
        + (x.orphan ? '<span class="badge warn">' + esc(t("tagFehlt")) + '</span>' : "")
        + (ge ? '<span class="badge changed">' + esc(t("tagGeaendert")) + '</span>' : "")
        + '</div><div class="table-logical">' + esc(x.t) + (x.otc != null ? " &middot; " + esc(String(x.otc)) : "") + '</div></td>'
      + '<td class="templates' + (x.templates ? "" : " without") + '">'
        + (x.templates ? esc(t("templates")(x.templates)) : esc(t("keineVorlage")))
        + (x.entwuerfe ? " <span class=\"entwurf\">" + esc(t("entwuerfe")(x.entwuerfe)) + "</span>" : "") + '</td>'
      + '<td><span class="state ' + (s ? "an" : "aus") + '">' + esc(s ? t("an") : t("aus")) + '</span>'
        + (s && !x.templates ? '<span class="badge warn">' + esc(t("tagOhne")) + '</span>' : "") + '</td>'
      + '</tr>';
  });
  $("tbody").innerHTML = h;
  $("tbl").hidden = L.length === 0;
  if(L.length > 400){ $("empty").hidden = false; $("empty").textContent = t("zuViele")(L.length); }
  else { $("empty").hidden = L.length !== 0; $("empty").textContent = t("empty"); }
  updateCounts();
}

function updateCounts(){
  var g = Object.keys(S.changes).length;
  var a = S.tables.filter(targetState).length;
  $("counter").innerHTML = t("zaehler")(a, g);
  $("save").disabled = S.saving || g === 0 || !canSave();
  $("discard").disabled = S.saving || g === 0;
  $("footer").textContent = t("gelesen")(S.tables.length);
  $("stored").textContent = S.raw ? (t("gespeichert") + " " + S.raw) : t("nochNichts");
}

function validate(){
  if(S.mayWrite === false){ message("warn", t("nurLesen")); return; }
  if(S.count === 0){ message("err", t("errKein")); return; }
  if(S.count > 1){ message("err", t("errMehr")(S.count)); return; }
  if(S.jsonBroken){ message("err", t("errJson")(esc(S.raw.slice(0,200)))); return; }
  if(!S.etag){ message("err", t("errKeinEtag")); return; }
  var w = [];
  var without = S.tables.filter(function(x){ return x.enabled && !x.templates; });
  if(without.length){
    w.push(t("warnOhne")(without.length)
      + ' <a href="#" id="show-problems">' + esc(t("warnZeigen")) + "</a>");
  }
  var orphans = S.tables.filter(function(x){ return x.orphan; });
  if(orphans.length){ w.push(t("warnVerwaist")(orphans.length)); }
  if(S.readErrors.length){ w.push(esc(S.readErrors.join(" · "))); }
  if(w.length){
    message("warn", t("warnKopf") + w.join(". ") + ".");
    var a = $("show-problems");
    if(a){ a.addEventListener("click", function(ev){ ev.preventDefault(); showProblems(); }); }
  } else { hideMessage(); }
}

function showProblems(){
  S.templatesOnly = false;
  $("filter-template").setAttribute("aria-pressed", "false");
  store("templatesOnly", "0");
  S.filter = "enabled";
  Array.prototype.forEach.call(document.querySelectorAll("#filters .x-chip:not(.schalt)"), function(x){
    x.setAttribute("aria-pressed", String(x.getAttribute("data-f") === "enabled"));
  });
  $("search").value = "";
  render();
}

function diff(){
  var an = [], aus = [];
  Object.keys(S.changes).forEach(function(k){ (S.changes[k] ? an : aus).push(k); });
  return { an:an.sort(), aus:aus.sort() };
}
function nextJson(){
  var o = {};
  Object.keys(S.json).forEach(function(k){ o[k] = S.json[k]; });
  Object.keys(S.changes).forEach(function(k){ if(S.changes[k]){ o[k] = true; } else { delete o[k]; } });
  return JSON.stringify(o);
}
function labelOf(k){
  var x = S.tables.filter(function(y){ return y.t === k; })[0];
  return x ? name(x) : k;
}

function saveDialogText(){
  var d = diff(), h = "";
  if(d.an.length){ h += '<div class="ein">' + esc(t("dlgEin")) + '</div><ul>'
    + d.an.map(function(k){ return "<li>" + esc(labelOf(k)) + "</li>"; }).join("") + "</ul>"; }
  if(d.aus.length){ h += '<div class="aus abstand">' + esc(t("dlgAus")) + '</div><ul>'
    + d.aus.map(function(k){ return "<li>" + esc(labelOf(k)) + "</li>"; }).join("") + "</ul>"; }
  h += '<p class="dlg-note">' + esc(t("dlgFuss")) + '</p>';
  return h;
}

function tipsAfterSave(d){
  var h = t("okKopf") + " <b>" + esc(t("tippsKopf")) + "</b><ul>";
  h += "<li>" + t("tippCache") + "</li>";
  if(d.an.length){ h += "<li>" + t("tippKnopf") + "</li>"; }
  var without = d.an.filter(function(k){
    var x = S.tables.filter(function(y){ return y.t === k; })[0];
    return x && !x.templates;
  });
  if(without.length){ h += "<li>" + t("tippOhneVorlage")(without.map(labelOf).map(esc).join(", ")) + "</li>"; }
  if(d.aus.length){ h += "<li>" + t("tippAus")(d.aus.map(labelOf).map(esc).join(", ")) + "</li>"; }
  h += "<li>" + t("tippAndere") + "</li>";
  h += "</ul>";
  return h;
}

function schalterSperren(){
  Array.prototype.forEach.call(document.querySelectorAll("#tbody input[type=checkbox]"), function(c){
    c.disabled = S.saving || S.mayWrite === false;
  });
}
async function save(){
  var next = nextJson(), d = diff(), gesendet = {};
  Object.keys(S.changes).forEach(function(k){ gesendet[k] = S.changes[k]; });
  S.saving = true;
  updateCounts();
  schalterSperren();
  try{
    await send("PATCH", "pdfsettings(" + S.record.pdfsettingid + ")", { pdfsettingsjson: next }, S.etag);
  }catch(e){
    S.saving = false;
    schalterSperren();
    if(e.status === 412){
      try{ await load(); }catch(e2){ S.readErrors.push(e2.message); }
      render();
      message("warn", t("errKonflikt"));
      return;
    }
    message("err", t("errSpeichern") + esc(e.message) + (e.status === 403 ? t("errRechte") : ""));
    updateCounts();
    return;
  }
  S.saving = false;
  S.lastChange = d;
  Object.keys(gesendet).forEach(function(k){
    if(S.changes[k] === gesendet[k]){ delete S.changes[k]; }
  });
  try{ await load(); }catch(e){ S.readErrors.push(e.message); }
  render();
  message("ok", tipsAfterSave(d));
  $("cache-hint").textContent = t("cacheHint");
  window.setTimeout(function(){ $("cache-hint").textContent = ""; }, 25000);
}

async function findCaches(){
  var f = { caches:[], idb:[], sw:0, idbUnbekannt:false };
  try{ if(window.caches && caches.keys){ f.caches = await caches.keys(); } }catch(e){}
  try{
    if(window.indexedDB && indexedDB.databases){
      f.idb = ((await indexedDB.databases()) || []).map(function(d){ return d.name; }).filter(Boolean);
    } else { f.idbUnbekannt = true; }
  }catch(e){ f.idbUnbekannt = true; }
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      f.sw = (await navigator.serviceWorker.getRegistrations()).length;
    }
  }catch(e){}
  return f;
}
async function clearCaches(f, wahl){
  var removed = { caches:0, idb:0, sw:0, fehler:[], unsicher:[] };
  if(wahl.caches){
    for(var i=0;i<f.caches.length;i++){
      try{ if(await caches.delete(f.caches[i])){ removed.caches++; } }catch(e){ removed.fehler.push(f.caches[i]); }
    }
  }
  if(wahl.idb){
    for(var k=0;k<f.idb.length;k++){
      var stand = await new Promise(function(ok){
        var r = indexedDB.deleteDatabase(f.idb[k]), fertig = false;
        function ende(v){ if(!fertig){ fertig = true; ok(v); } }
        r.onsuccess = function(){ ende("ok"); };
        r.onerror = function(){ ende("fehler"); };
        r.onblocked = function(){ ende("offen"); };
        window.setTimeout(function(){ ende("offen"); }, 3000);
      });
      if(stand === "ok"){ removed.idb++; }
      else if(stand === "offen"){ removed.unsicher.push(f.idb[k]); }
      else { removed.fehler.push(f.idb[k]); }
    }
  }
  if(wahl.sw){
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        var R = await navigator.serviceWorker.getRegistrations();
        for(var j=0;j<R.length;j++){ if(await R[j].unregister()){ removed.sw++; } }
      }
    }catch(e){ removed.fehler.push("service worker"); }
  }
  return removed;
}
function cacheFeld(id, text, an, moeglich){
  return '<label class="c-wahl"><input type="checkbox" id="' + id + '"' + (an ? " checked" : "")
       + (moeglich ? "" : " disabled") + '><span>' + esc(text) + "</span></label>";
}
function cacheWahl(){
  function an(id){ var e = $(id); return !!(e && e.checked && !e.disabled); }
  return { caches:an("c-caches"), idb:an("c-idb"), sw:an("c-sw") };
}
function cacheDialogText(f){
  var h = t("cText")(esc(location.host));
  h += '<div class="fund">';
  h += cacheFeld("c-caches", t("cEintraege")(f.caches.length), CACHE_DEFAULTS.caches && f.caches.length > 0, f.caches.length > 0);
  h += f.idbUnbekannt ? "<span>" + esc(t("cDbUnbekannt")) + "</span>"
                      : cacheFeld("c-idb", t("cDb")(f.idb.length), CACHE_DEFAULTS.idb && f.idb.length > 0, f.idb.length > 0)
                        + '<p class="c-hinweis">' + esc(t("cDbHinweis")) + "</p>";
  h += cacheFeld("c-sw", t("cSw")(f.sw), CACHE_DEFAULTS.sw && f.sw > 0, f.sw > 0);
  h += "</div>";
  var N = f.caches.concat(f.idb);
  if(N.length){
    h += '<p class="dlg-note">' + esc(t("cListe")) + '</p><ul class="c-liste">'
       + N.slice(0, 12).map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("")
       + (N.length > 12 ? "<li>" + esc(t("cWeitere")(N.length - 12)) + "</li>" : "") + "</ul>";
  }
  h += '<div class="note-box">' + t("cWarn") + "</div>";
  h += '<p class="dlg-note">' + esc(t("cSwHinweis")) + "</p>";
  if(f.idbUnbekannt){ h += '<div class="note-box">' + esc(t("cFirefox")) + "</div>"; }
  return h;
}
async function clearAndReport(f, wahl){
  $("cache").disabled = true;
  var removed = await clearCaches(f, wahl);
  $("cache").disabled = false;
  var parts = [];
  if(removed.caches){ parts.push(t("cEintraege")(removed.caches)); }
  if(removed.idb){ parts.push(t("cDb")(removed.idb)); }
  if(removed.sw){ parts.push(t("cSw")(removed.sw)); }
  var rest = (removed.fehler.length ? t("cFehler")(esc(removed.fehler.join(", "))) : "")
           + (removed.unsicher.length ? t("cUnsicher")(esc(removed.unsicher.join(", "))) : "");
  if(!parts.length){ message("warn", t("cNix")(esc(location.host)) + rest); return; }
  message(removed.unsicher.length ? "warn" : "ok", t("cFertig")(esc(parts.join(", "))) + rest);
  $("cache-hint").textContent = "";
}
async function cacheFlow(){
  var f = await findCaches(), dlg = $("dlgC");
  $("dlgC-body").innerHTML = cacheDialogText(f);
  var nichts = (f.caches.length + f.idb.length + f.sw) === 0;
  $("dlgC-ok").textContent = nichts ? t("cNichts") : t("cLeeren");
  function stand(){
    var w = cacheWahl();
    $("dlgC-ok").disabled = nichts || !(w.caches || w.idb || w.sw);
  }
  Array.prototype.forEach.call($("dlgC-body").querySelectorAll("input[type=checkbox]"), function(c){
    c.addEventListener("change", stand);
  });
  stand();
  dlg.returnValue = "";
  dlg.onclose = async function(){ var w = cacheWahl(); if(dlg.returnValue === "ja"){ await clearAndReport(f, w); } };
  if(typeof dlg.showModal === "function"){ dlg.showModal(); }
  else if(window.confirm(t("cTitel"))){ await clearAndReport(f, cacheWahl()); }
}

function setLanguage(l){
  LANG = (l === "en") ? "en" : "de";
  document.documentElement.lang = LANG;
  store("spr", LANG);
  Array.prototype.forEach.call(document.querySelectorAll(".language button"), function(b){
    b.setAttribute("aria-pressed", String(b.getAttribute("data-l") === LANG));
  });
  $("title").textContent = t("titel");
  document.title = t("titel") + " \u2013 " + (ENV.name || location.host);
  $("search").placeholder = t("suche");
  $("search").setAttribute("aria-label", t("suche"));
  document.querySelector('[data-f=all]').textContent = t("fAlle");
  document.querySelector('[data-f=enabled]').textContent = t("fAktiv");
  document.querySelector('[data-f=custom]').textContent = t("fEigen");
  $("filter-template").textContent = t("fVorlage");
  $("discard").textContent = t("verwerfen");
  $("save").textContent = t("save");
  $("cache").textContent = t("cache");
  $("col-pdf").textContent = t("hPdf");
  $("col-table").textContent = t("hTab");
  $("col-templates").textContent = t("hVor");
  $("col-status").textContent = t("hSt");
  $("loading-text").textContent = t("lade");
  $("dlg-title").textContent = t("dlgTitel");
  $("dlg-cancel").textContent = t("abbrechen");
  $("dlg-ok").textContent = t("save");
  $("dlgC-title").textContent = t("cTitel");
  $("dlgC-cancel").textContent = t("abbrechen");
  $("dlgC-ok").textContent = t("cLeeren");
  $("who-can-change").textContent = t("werDarf");
  $("dlgW-title").textContent = t("wdTitel");
  $("dlgW-close").textContent = t("schliessen");
  if(S.tables.length){ render(); validate(); }
}
function detectLanguage(){
  var g = readStored("spr");
  if(g === "de" || g === "en"){ return g; }
  var L = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || "en"];
  for(var i=0;i<L.length;i++){
    var s = String(L[i] || "").toLowerCase();
    if(s.indexOf("de") === 0){ return "de"; }
    if(s.indexOf("en") === 0){ return "en"; }
  }
  return "en";
}

function bindEvents(){
  $("search").addEventListener("input", render);
  Array.prototype.forEach.call(document.querySelectorAll("#filters .x-chip:not(.schalt)"), function(c){
    c.addEventListener("click", function(){
      S.filter = c.getAttribute("data-f");
      Array.prototype.forEach.call(document.querySelectorAll("#filters .x-chip:not(.schalt)"), function(x){
        x.setAttribute("aria-pressed", String(x === c));
      });
      render();
    });
  });
  $("filter-template").addEventListener("click", function(){
    S.templatesOnly = !S.templatesOnly;
    $("filter-template").setAttribute("aria-pressed", String(S.templatesOnly));
    store("templatesOnly", S.templatesOnly ? "1" : "0");
    render();
  });
  $("tbody").addEventListener("change", function(ev){
    var cb = ev.target;
    if(!cb || cb.type !== "checkbox"){ return; }
    var k = cb.getAttribute("data-t");
    var x = S.tables.filter(function(y){ return y.t === k; })[0];
    if(!x){ return; }
    if(cb.checked === x.enabled){ delete S.changes[k]; } else { S.changes[k] = cb.checked; }
    render();
  });
  $("discard").addEventListener("click", function(){ S.changes = {}; render(); validate(); });
  $("save").addEventListener("click", function(){
    var dlg = $("dlg");
    $("dlg-body").innerHTML = saveDialogText();
    dlg.returnValue = "";
    dlg.onclose = function(){ if(dlg.returnValue === "ja"){ save(); } };
    if(typeof dlg.showModal === "function"){ dlg.showModal(); }
    else if(window.confirm(t("dlgTitel"))){ save(); }
  });
  $("cache").addEventListener("click", function(){ cacheFlow(); });
  $("who-can-change").addEventListener("click", function(ev){ ev.preventDefault(); whoCanChangeFlow(); });
  Array.prototype.forEach.call(document.querySelectorAll(".language button"), function(b){
    b.addEventListener("click", function(){ setLanguage(b.getAttribute("data-l")); });
  });
  window.addEventListener("beforeunload", function(e){
    if(Object.keys(S.changes).length){ e.preventDefault(); e.returnValue = ""; }
  });
}

function themeMissingScreen(){
  var d = document.createElement("div");
  d.id = "theme-missing";
  d.setAttribute("style", "margin:40px auto;max-width:620px;padding:16px;border:1px solid #bac1c4;"
    + "border-left:4px solid #805c00;border-radius:8px;background:#fff7df;color:#805c00;"
    + "font:14px/20px 'Segoe UI',Arial,sans-serif");
  d.innerHTML = t("kanonFehlt");
  document.body.setAttribute("style", "margin:0;background:#fafbfb");
  document.body.innerHTML = "";
  document.body.appendChild(d);
}

function themeLoaded(){
  var v = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  return v !== "";
}

async function start(){
  LANG = detectLanguage();
  if(readStored("templatesOnly") === "0"){ S.templatesOnly = false; }
  $("filter-template").setAttribute("aria-pressed", String(S.templatesOnly));
  if(!themeLoaded()){ themeMissingScreen(); return; }
  $("host").textContent = location.host;
  await readEnvironment();
  $("environment").textContent = ENV.name;
  if(ENV.production){ $("environment").className = "environment prd"; }
  setLanguage(LANG);
  bindEvents();
  try{ await load(); }
  catch(e){ $("loading").hidden = true; message("err", t("errLaden") + esc(e.message)); return; }
  await checkPrivileges();
  $("loading").hidden = true;
  render();
  validate();
  if(!themeLoaded()){ themeMissingScreen(); return; }
}

if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", start); }
else { start(); }
})();
</script>
